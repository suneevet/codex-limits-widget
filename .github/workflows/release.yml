name: Build Windows release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check release version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { "publish=false" >> $env:GITHUB_OUTPUT }
          else { "publish=true" >> $env:GITHUB_OUTPUT }
          exit 0
      - uses: actions/setup-node@v4
        if: steps.version.outputs.publish == 'true'
        with:
          node-version: '24'
          cache: npm
      - name: Locate Inno Setup
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            $download = Join-Path $env:RUNNER_TEMP 'inno-6.7.4.exe'
            $directory = Join-Path $env:RUNNER_TEMP 'inno'
            Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe -OutFile $download
            $signature = Get-AuthenticodeSignature -LiteralPath $download
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys') {
              throw 'Inno Setup signature validation failed.'
            }
            $setup = Start-Process $download -ArgumentList @("/DIR=""$directory""", '/CURRENTUSER', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOICONS', '/PORTABLE=1') -WindowStyle Hidden -Wait -PassThru
            if ($setup.ExitCode -ne 0) { throw "Inno Setup exited with $($setup.ExitCode)." }
            $compiler = Join-Path $directory 'ISCC.exe'
          }
          "INNO_COMPILER=$compiler" >> $env:GITHUB_ENV
      - name: Test and package Electron widget
        if: steps.version.outputs.publish == 'true'
        shell: powershell
        run: .\build.ps1 -InnoCompiler $env:INNO_COMPILER
      - name: Publish version and Windows packages
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $description = (Get-Content README.md -Raw) -split '\r?\n'
          $heading = [array]::IndexOf($description, "## $env:RELEASE_TAG")
          $notes = @()
          if ($heading -ge 0) {
            foreach ($line in $description[($heading + 1)..($description.Count - 1)]) {
              if ($line -match '^## ') { break }
              $notes += $line
            }
          }
          $options = @('--generate-notes')
          if (($notes -join [Environment]::NewLine).Trim()) {
            $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
            $notes | Set-Content -LiteralPath $notesPath -Encoding UTF8
            $options = @('--notes-file', $notesPath)
          }
          gh release create $env:RELEASE_TAG dist/CodexLimitsWidget-Setup.exe dist/CodexLimitsWidget.exe --target $env:GITHUB_SHA --title $env:RELEASE_TAG @options
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
